<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title"><title id="title">Engineering OS local architecture</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627a94"/></marker></defs><rect width="1120" height="440" rx="16" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#172b4d}.label{font-size:20px;font-weight:bold}.note{font-size:15px}</style><text x="32" y="46" class="label">Engineering OS · local data flow</text><rect x="32" y="110" width="310" height="125" rx="12" fill="white" stroke="#789bd0"/><text x="48" y="145" class="label">Configured source</text><text x="48" y="175" class="note">Beads export or JSONL</text><text x="48" y="199" class="note">Synthetic fixture by default</text><rect x="404" y="110" width="310" height="125" rx="12" fill="white" stroke="#789bd0"/><text x="420" y="145" class="label">Local API + cache</text><text x="420" y="175" class="note">Normalize tasks and dependencies</text><text x="420" y="199" class="note">Retain graph on refresh failure</text><rect x="776" y="110" width="310" height="125" rx="12" fill="white" stroke="#789bd0"/><text x="792" y="145" class="label">Browser dashboard</text><text x="792" y="175" class="note">Projects / graph / ready queue</text><text x="792" y="199" class="note">Quarterly review / source health</text><path d="M342 174h62" stroke="#627a94" stroke-width="2" marker-end="url(#arrow)"/><path d="M714 174h62" stroke="#627a94" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="280" width="510" height="105" rx="12" fill="#ecf7f1" stroke="#68a890"/><text x="48" y="315" class="label">Saved plans · explicit repository allowlist</text><text x="48" y="345" class="note">Private ledger; no execution or automatic tracker writes</text><rect x="576" y="280" width="510" height="105" rx="12" fill="#fff7e5" stroke="#ba9847"/><text x="592" y="315" class="label">Separate services and future integration</text><text x="592" y="345" class="note">Note search and OpenCode are not wired to plan execution</text></svg>