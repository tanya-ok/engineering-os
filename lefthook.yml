# Git hooks. Install once with: lefthook install
# (lefthook is a standalone binary: brew install lefthook, or see lefthook.dev)
pre-commit:
  parallel: true
  commands:
    anonymization:
      run: scripts/anonymization-check.sh staged
    biome-rag:
      glob: "rag/**/*.{ts,json}"
      run: pnpm --dir rag exec biome check .
    biome-dashboard:
      glob: "dashboard/**/*.{ts,tsx,mjs,json}"
      run: pnpm --dir dashboard exec biome check .

pre-push:
  commands:
    anonymization-range:
      run: scripts/anonymization-check.sh range
