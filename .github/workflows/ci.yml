name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # CPU-only embeddings; do not download CUDA binaries at install time.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [rag, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ matrix.package }}/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.package }}/pnpm-lock.yaml
      - run: pnpm --dir ${{ matrix.package }} install --frozen-lockfile
      - run: pnpm --dir ${{ matrix.package }} exec biome ci .
      - run: pnpm --dir ${{ matrix.package }} run typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [rag, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ matrix.package }}/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.package }}/pnpm-lock.yaml
      - run: pnpm --dir ${{ matrix.package }} install --frozen-lockfile
      # Unit tests only. The rag end-to-end suite (EOS_E2E=1) downloads the
      # embedding model and is run locally, not in CI.
      - run: pnpm --dir ${{ matrix.package }} run build
      - run: pnpm --dir ${{ matrix.package }} test

  anonymization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test anonymization gate
        run: bash scripts/anonymization-check.test.sh
      - name: Anonymization gate (full tree)
        run: |
          bash scripts/anonymization-check.sh all | tee -a "$GITHUB_STEP_SUMMARY"

  secrets:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: false
      - name: Scan all reachable history with redacted output
        run: gitleaks git --log-opts=--all --redact --config .gitleaks.toml
