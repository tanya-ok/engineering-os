name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # CPU-only embeddings; do not download CUDA binaries at install time.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [rag, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ matrix.package }}/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ${{ matrix.package }}/pnpm-lock.yaml
      - run: pnpm --dir ${{ matrix.package }} install --frozen-lockfile
      - run: pnpm --dir ${{ matrix.package }} exec biome ci .
      - run: pnpm --dir ${{ matrix.package }} run typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [rag, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ matrix.package }}/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ${{ matrix.package }}/pnpm-lock.yaml
      - run: pnpm --dir ${{ matrix.package }} install --frozen-lockfile
      # Unit tests only. The rag end-to-end suite (EOS_E2E=1) downloads the
      # embedding model and is run locally, not in CI.
      - run: pnpm --dir ${{ matrix.package }} run build
      - run: pnpm --dir ${{ matrix.package }} test

  anonymization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test anonymization gate
        run: bash scripts/anonymization-check.test.sh
      - name: Anonymization gate (full tree)
        run: |
          bash scripts/anonymization-check.sh all | tee -a "$GITHUB_STEP_SUMMARY"

  secrets:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          scan_install_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_install_dir"' EXIT
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$scan_install_dir/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$scan_install_dir/$archive" | sha256sum --check --strict -
          tar -xzf "$scan_install_dir/$archive" -C "$scan_install_dir" gitleaks
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          install -m 755 "$scan_install_dir/gitleaks" "$RUNNER_TEMP/gitleaks-bin/gitleaks"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Test scanning from the root commit
        run: bash scripts/scan-secrets.test.sh
      - name: Scan all reachable history with redacted output
        run: bash scripts/scan-secrets.sh
